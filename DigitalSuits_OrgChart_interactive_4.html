<script>
  const wrap=document.getElementById('wrap'),img=document.getElementById('img-el'),lbl=document.getElementById('zoom-label');
  let scale=1,tx=0,ty=0,dragging=false,sx=0,sy=0,stx=0,sty=0;

  function apply(){img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;lbl.textContent=Math.round(scale*100)+'%';}
  function fit(){
    const iw=img.naturalWidth,ih=img.naturalHeight,ww=wrap.clientWidth,wh=wrap.clientHeight;
    scale=Math.min(ww/iw,wh/ih,1);
    tx=(ww-iw*scale)/2; ty=(wh-ih*scale)/2; apply();
  }
  function resetView(){fit();}
  function zoom(d){
    const cx=wrap.clientWidth/2,cy=wrap.clientHeight/2,ns=Math.min(Math.max(scale+d,0.05),8);
    tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale); scale=ns; apply();
    gtag('event','zoom',{'direction':d>0?'in':'out','scale':Math.round(ns*100)});
  }

  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    const d=e.deltaY<0?0.15:-0.15,ns=Math.min(Math.max(scale+d,0.05),8);
    tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns; apply();
  },{passive:false});

  wrap.addEventListener('mousedown',e=>{
    dragging=true;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;wrap.classList.add('dragging');
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;tx=stx+(e.clientX-sx);ty=sty+(e.clientY-sy);apply();
  });
  window.addEventListener('mouseup',()=>{dragging=false;wrap.classList.remove('dragging');});

  let ltd=null;
  wrap.addEventListener('touchstart',e=>{
    if(e.touches.length===1){dragging=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;stx=tx;sty=ty;}
  });
  wrap.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&dragging){tx=stx+(e.touches[0].clientX-sx);ty=sty+(e.touches[0].clientY-sy);apply();}
    else if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(ltd){const delta=(d-ltd)*0.01,cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2,r=wrap.getBoundingClientRect(),mx=cx-r.left,my=cy-r.top,ns=Math.min(Math.max(scale+delta,0.05),8);tx=mx-(mx-tx)*(ns/scale);ty=my-(my-ty)*(ns/scale);scale=ns;apply();}
      ltd=d;
    }
  },{passive:false});
  wrap.addEventListener('touchend',()=>{dragging=false;ltd=null;});

  img.onload=fit; if(img.complete)fit();
  window.addEventListener('resize',fit);

  // Track time spent
  let startTime=Date.now();
  window.addEventListener('beforeunload',()=>{
    const sec=Math.round((Date.now()-startTime)/1000);
    gtag('event','time_spent',{'seconds':sec});
  });
</script>
